name: keepalive
# Render Free는 15분 idle 후 sleep → cold start 30~60초.
# KST 07~23시만 매 10분 핑해서 깨워둔다 (퍼블릭 리포 = Actions 무제한).
# API URL은 코드에 박지 않고 repo variable로: Settings → Secrets and variables
#   → Actions → Variables → New: RENDER_API_URL = https://<your-api>.onrender.com
on:
  schedule:
    - cron: '*/10 22-23,0-14 * * *'  # UTC 22~14시 = KST 07~23시
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render API
        env:
          API_URL: ${{ vars.RENDER_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "RENDER_API_URL repo variable 미설정 — 건너뜀"
            exit 0
          fi
          curl -fsS --max-time 90 "$API_URL/healthz" \
            || echo "Healthz 실패 (cold start면 다음 라운드에 재시도)"
